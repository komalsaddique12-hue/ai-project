<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Expense Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1a4d4a;
            --primary-light: #2d7a75;
            --accent: #d4c5a9;
            --accent-dark: #b8a580;
            --bg: #f0f4f3;
            --card-bg: #ffffff;
            --text: #1e1e1e;
            --muted: #888;
            --border: #e6eae9;
            --danger: #e74c3c;
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }

        body {
            background: var(--bg);
            min-height: 100vh;
            padding: 25px 15px;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(45,122,117,0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(212,197,169,0.15) 0%, transparent 45%);
        }

        .app { max-width: 1000px; margin: 0 auto; }

        /* ===== TOP BRAND BAR ===== */
        .brand-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            padding: 0 8px;
        }
        .brand-bar .logo {
            width: 46px; height: 46px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 20px rgba(26,77,74,0.3);
        }
        .brand-bar .brand-text h2 {
            font-family: var(--font-heading);
            font-size: 20px;
            color: var(--primary-dark);
            letter-spacing: -0.5px;
            font-weight: 700;
        }
        .brand-bar .brand-text p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
            font-weight: 500;
        }

        /* ===== CARD ===== */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(26,77,74,0.10);
            margin-bottom: 20px;
        }

        /* ===== SALARY HERO ===== */
        .salary-hero {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            border-radius: 20px;
            padding: 25px 28px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 12px 30px rgba(26,77,74,0.28);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }
        .salary-hero::before {
            content: '';
            position: absolute;
            top: -50%; right: -5%;
            width: 220px; height: 220px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
        }
        .salary-hero .hero-left {
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 1;
        }
        .salary-hero .hero-icon {
            width: 52px; height: 52px;
            background: rgba(255,255,255,0.18);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }
        .salary-hero .hero-text h3 {
            font-family: var(--font-heading);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 3px;
            letter-spacing: -0.3px;
        }
        .salary-hero .hero-text p {
            font-size: 12px;
            opacity: 0.85;
            font-weight: 500;
        }
        .salary-hero .hero-input {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.18);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 14px;
            padding: 8px 8px 8px 18px;
            position: relative;
            z-index: 1;
            transition: 0.2s;
        }
        .salary-hero .hero-input:focus-within {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.6);
        }
        .salary-hero .hero-input .curr {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 16px;
            margin-right: 6px;
            color: var(--accent);
        }
        .salary-hero .hero-input input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-family: var(--font-heading);
            font-size: 22px;
            font-weight: 700;
            width: 180px;
            padding: 8px 0;
            letter-spacing: -0.5px;
        }
        .salary-hero .hero-input input::placeholder {
            color: rgba(255,255,255,0.55);
            font-weight: 500;
            font-size: 16px;
        }

        /* ===== SECTION HEAD ===== */
        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding: 0 4px;
        }
        .section-head h3 {
            font-family: var(--font-heading);
            font-size: 15px;
            color: var(--primary-dark);
            font-weight: 600;
            letter-spacing: -0.2px;
        }
        .section-head p {
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
        }

        /* ===== MONTHS GRID ===== */
        .months-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 25px;
        }

        .month-card {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            transition: 0.3s;
        }
        .month-card:hover {
            box-shadow: 0 12px 25px rgba(0,0,0,0.06);
        }

        .month-head {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .month-card.prev .month-head {
            background: linear-gradient(135deg, #f4efe4, #ebe2d0);
            border-bottom: 2px solid #e5d9be;
        }
        .month-card.curr .month-head {
            background: linear-gradient(135deg, #e8f4f2, #d9ece9);
            border-bottom: 2px solid #c5e0dc;
        }
        .month-head .m-title {
            font-family: var(--font-heading);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .month-card.prev .m-title { color: #8a7a5c; }
        .month-card.curr .m-title { color: var(--primary-dark); }

        .month-head select {
            background: #fff;
            border: 1.5px solid rgba(0,0,0,0.08);
            padding: 6px 12px;
            border-radius: 8px;
            font-family: var(--font-heading);
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        .month-head select:hover { border-color: var(--primary-light); }

        .month-body { padding: 16px; }

        .expense-input {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .expense-input input {
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 11px;
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            outline: none;
            transition: 0.2s;
            background: #fafbfa;
            color: var(--text);
        }
        .expense-input input:focus {
            border-color: var(--primary-light);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(45,122,117,0.08);
        }
        .expense-input .iname { flex: 2; }
        .expense-input .iamt  { flex: 1; min-width: 80px; }

        .expense-input .add-btn {
            width: 44px; height: 44px;
            border-radius: 11px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: white;
            border: none;
            font-size: 22px;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 6px 15px rgba(26,77,74,0.25);
            flex-shrink: 0;
        }
        .expense-input .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(26,77,74,0.35);
        }

        .expense-list {
            max-height: 250px;
            overflow-y: auto;
            border-radius: 12px;
        }

        .exp-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 11px;
            margin-bottom: 7px;
            transition: 0.2s;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .exp-item:hover {
            border-color: var(--primary-light);
            background: #f8faf9;
        }
        .exp-item .e-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .exp-item .e-avatar {
            width: 32px; height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, #e8f4f2, #d0e8e4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-size: 14px;
            color: var(--primary-dark);
            font-weight: 600;
            flex-shrink: 0;
        }
        .exp-item .e-name {
            font-weight: 500;
            color: var(--text);
            font-size: 13.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .exp-item .e-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .exp-item .e-amount {
            font-family: var(--font-heading);
            font-weight: 600;
            color: var(--primary-dark);
            font-size: 13.5px;
            font-feature-settings: 'tnum';
            letter-spacing: -0.2px;
        }
        .exp-item .del {
            background: #fef2f1;
            color: var(--danger);
            border: none;
            width: 26px; height: 26px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .exp-item .del:hover {
            background: var(--danger);
            color: white;
        }

        .empty-msg {
            text-align: center;
            padding: 25px 15px;
            color: var(--muted);
            font-size: 12.5px;
            background: #fafbfa;
            border: 2px dashed var(--border);
            border-radius: 11px;
            font-weight: 500;
        }
        .empty-msg .emoji {
            font-size: 26px;
            display: block;
            margin-bottom: 6px;
            opacity: 0.45;
        }

        /* ===== ACTIONS ===== */
        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            padding: 16px;
            border-radius: 14px;
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.25s;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: -0.1px;
        }
        .btn-analyze {
            flex: 1;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: white;
            box-shadow: 0 12px 28px rgba(26,77,74,0.3);
        }
        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 35px rgba(26,77,74,0.4);
        }
        .btn-reset {
            background: #fff;
            color: var(--primary-dark);
            border: 2px solid var(--border);
            min-width: 130px;
        }
        .btn-reset:hover {
            border-color: var(--primary-dark);
            background: #f8faf9;
        }

        /* ===== LOADING ===== */
        .loading {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(26,77,74,0.95);
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .loading.active { display: flex; }
        .spinner {
            width: 70px; height: 70px;
            border: 6px solid rgba(255,255,255,0.25);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p {
            font-family: var(--font-heading);
            font-size: 15px;
            letter-spacing: 0.3px;
            font-weight: 500;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .card { padding: 20px; }
            .months-grid { grid-template-columns: 1fr; }
            .salary-hero { padding: 20px; }
            .salary-hero .hero-input input { width: 140px; font-size: 18px; }
            .action-row { flex-direction: column; }
            .btn-reset { min-width: auto; }
        }
    </style>
</head>
<body>

<div class="app">

    <!-- BRAND BAR -->
    <div class="brand-bar">
        <div class="logo">💰</div>
        <div class="brand-text">
            <h2>ExpenseAI</h2>
            <p>Compare two months and see your savings</p>
        </div>
    </div>

    <!-- MAIN CARD -->
    <div class="card">

        <!-- SALARY HERO -->
        <div class="salary-hero">
            <div class="hero-left">
                <div class="hero-icon">💵</div>
                <div class="hero-text">
                    <h3>Your Monthly Salary</h3>
                    <p>Enter your salary — same for both months</p>
                </div>
            </div>
            <div class="hero-input">
                <span class="curr">Rs</span>
                <input type="number" id="salaryInput" placeholder="Enter your salary">
            </div>
        </div>

        <!-- MONTHS SECTION HEADER -->
        <div class="section-head">
            <h3>📊 Add Expenses</h3>
            <p>Fill both months to compare</p>
        </div>

        <!-- MONTHS GRID -->
        <div class="months-grid">

            <!-- PREVIOUS -->
            <div class="month-card prev">
                <div class="month-head">
                    <span class="m-title">📅 Previous</span>
                    <select id="prevMonthInput">
                        <option>January</option><option>February</option>
                        <option>March</option><option>April</option>
                        <option>May</option><option>June</option>
                        <option>July</option><option>August</option>
                        <option>September</option><option>October</option>
                        <option>November</option><option>December</option>
                    </select>
                </div>
                <div class="month-body">
                    <div class="expense-input">
                        <input type="text" class="iname" id="prevExpenseName" placeholder="Expense (rent, food)">
                        <input type="number" class="iamt" id="prevExpenseAmount" placeholder="Amount">
                        <button class="add-btn" onclick="addExpense('prev')">+</button>
                    </div>
                    <div class="expense-list" id="prevExpenseList">
                        <div class="empty-msg">
                            <span class="emoji">🧾</span>
                            No expenses yet
                        </div>
                    </div>
                </div>
            </div>

            <!-- CURRENT -->
            <div class="month-card curr">
                <div class="month-head">
                    <span class="m-title">📅 Current</span>
                    <select id="currMonthInput">
                        <option>January</option><option>February</option>
                        <option>March</option><option>April</option>
                        <option>May</option><option>June</option>
                        <option>July</option><option>August</option>
                        <option>September</option><option>October</option>
                        <option>November</option><option>December</option>
                    </select>
                </div>
                <div class="month-body">
                    <div class="expense-input">
                        <input type="text" class="iname" id="currExpenseName" placeholder="Expense (rent, food)">
                        <input type="number" class="iamt" id="currExpenseAmount" placeholder="Amount">
                        <button class="add-btn" onclick="addExpense('curr')">+</button>
                    </div>
                    <div class="expense-list" id="currExpenseList">
                        <div class="empty-msg">
                            <span class="emoji">🧾</span>
                            No expenses yet
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- ACTIONS -->
        <div class="action-row">
            <button class="btn btn-analyze" onclick="analyze()">
                🤖 Analyze & Compare with AI
            </button>
            <button class="btn btn-reset" onclick="resetAll()">
                🔄 Reset
            </button>
        </div>

    </div>
</div>

<!-- LOADING -->
<div class="loading" id="loading">
    <div class="spinner"></div>
    <p>🤖 AI is analyzing your expenses...</p>
</div>

<script>
    // ===== State =====
    const data = {
        prev: { expenses: [] },
        curr: { expenses: [] }
    };

    // ===== Month Defaults =====
    const monthNames = ["January","February","March","April","May","June",
                        "July","August","September","October","November","December"];
    const now = new Date();
    const currIdx = now.getMonth();
    const prevIdx = (currIdx - 1 + 12) % 12;

    document.getElementById('prevMonthInput').value = monthNames[prevIdx];
    document.getElementById('currMonthInput').value = monthNames[currIdx];

    // ===== Add Expense =====
    function addExpense(which) {
        const nameEl = document.getElementById(which + 'ExpenseName');
        const amtEl  = document.getElementById(which + 'ExpenseAmount');
        const name = nameEl.value.trim();
        const amount = parseFloat(amtEl.value);

        if (!name || isNaN(amount) || amount <= 0) {
            alert("Please enter a valid expense name and amount.");
            return;
        }

        data[which].expenses.push({ name, amount });
        nameEl.value = '';
        amtEl.value = '';
        nameEl.focus();

        renderExpenses(which);
    }

    // Enter key
    ['prev', 'curr'].forEach(which => {
        document.getElementById(which + 'ExpenseAmount').addEventListener('keypress', e => {
            if (e.key === 'Enter') addExpense(which);
        });
        document.getElementById(which + 'ExpenseName').addEventListener('keypress', e => {
            if (e.key === 'Enter') document.getElementById(which + 'ExpenseAmount').focus();
        });
    });

    // ===== Render =====
    function renderExpenses(which) {
        const list = document.getElementById(which + 'ExpenseList');
        const items = data[which].expenses;

        if (items.length === 0) {
            list.innerHTML = `
                <div class="empty-msg">
                    <span class="emoji">🧾</span>
                    No expenses yet
                </div>`;
            return;
        }

        list.innerHTML = items.map((e, i) => {
            const initial = e.name.charAt(0).toUpperCase();
            return `<div class="exp-item">
                <div class="e-left">
                    <div class="e-avatar">${initial}</div>
                    <div class="e-name">${e.name}</div>
                </div>
                <div class="e-right">
                    <span class="e-amount">Rs ${e.amount.toLocaleString()}</span>
                    <button class="del" onclick="removeExpense('${which}', ${i})">×</button>
                </div>
            </div>`;
        }).join('');
    }

    function removeExpense(which, index) {
        data[which].expenses.splice(index, 1);
        renderExpenses(which);
    }

    // ===== Reset =====
    function resetAll() {
        data.prev.expenses = [];
        data.curr.expenses = [];
        document.getElementById('salaryInput').value = '';
        document.getElementById('prevMonthInput').value = monthNames[prevIdx];
        document.getElementById('currMonthInput').value = monthNames[currIdx];
        ['prev', 'curr'].forEach(w => {
            document.getElementById(w + 'ExpenseName').value = '';
            document.getElementById(w + 'ExpenseAmount').value = '';
        });
        renderExpenses('prev');
        renderExpenses('curr');
    }

    // ===== Analyze =====
    async function analyze() {
        const salary = parseFloat(document.getElementById('salaryInput').value);
        const prevMonth = document.getElementById('prevMonthInput').value;
        const currMonth = document.getElementById('currMonthInput').value;

        if (isNaN(salary) || salary <= 0) {
            alert("Please enter your monthly salary first.");
            document.getElementById('salaryInput').focus();
            return;
        }
        if (data.prev.expenses.length === 0 || data.curr.expenses.length === 0) {
            alert("Please add at least one expense in both months.");
            return;
        }
        if (prevMonth === currMonth) {
            alert("Please select two different months.");
            return;
        }

        document.getElementById('loading').classList.add('active');

        try {
            const response = await fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    previous: { month: prevMonth, salary: salary, expenses: data.prev.expenses },
                    current:  { month: currMonth, salary: salary, expenses: data.curr.expenses }
                })
            });

            const result = await response.json();

            sessionStorage.setItem('analysisResult', JSON.stringify(result));
            sessionStorage.setItem('prevMonth', prevMonth);
            sessionStorage.setItem('currMonth', currMonth);
            sessionStorage.setItem('prevSalary', salary);
            sessionStorage.setItem('currSalary', salary);

            window.location.href = '/analysis';

        } catch (err) {
            console.error(err);
            alert("Error connecting to backend.");
            document.getElementById('loading').classList.remove('active');
        }
    }

    // Initial
    renderExpenses('prev');
    renderExpenses('curr');
</script>
</body>
</html>
